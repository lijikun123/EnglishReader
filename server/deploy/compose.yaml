name: kreader-sync

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=96MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KREADER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KREADER_DATABASE_USER: ${POSTGRES_USER}
      KREADER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KREADER_HOST: 0.0.0.0
      KREADER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # First deployment is only reachable from this VPS. Caddy/HTTPS is enabled
      # after a domain is configured.
      - "127.0.0.1:18080:8080"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data
      - edge

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      KREADER_DOMAIN: ${KREADER_DOMAIN}
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  # PostgreSQL is never exposed to the host or Internet.
  data:
    internal: true
  edge:
