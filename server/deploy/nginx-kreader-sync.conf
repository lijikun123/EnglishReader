# Include this file inside the existing HTTPS server block. It deliberately
# owns only /kreader-sync/ so other VPS apps (including sing-box) stay intact.

location = /kreader-sync {
    return 308 /kreader-sync/;
}

location ^~ /kreader-sync/ {
    # Matches KREADER_MAX_BUNDLE_BYTES (25 MiB) enforced by the API itself.
    client_max_body_size 25m;

    # The trailing slash removes /kreader-sync/ before forwarding to Ktor,
    # so Android can use https://your-domain/kreader-sync as its base URL.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /kreader-sync;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
}
